name: Refresh data and deploy

on:
  schedule:
    # Daily at 10:17 UTC (about 6 AM Eastern). Edit to change how often data refreshes.
    - cron: "17 10 * * *"
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.refresh.outcome }}
    steps:
      # Always build from the latest main. A re-run otherwise reuses the run's original
      # commit, which is behind main once that run's first attempt pushed new data.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # One broken source shouldn't hold back the others: keep going, then fail the run at the end.
      - name: Refresh values, IDP data and Sleeper snapshot
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 refresh_data.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add values.js idp.js league-data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh values and league data ($(date -u +%Y-%m-%d))"
            # Pick up anything pushed to main while this run was working.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Marks the run failed (and emails you) when a source couldn't be read. The site still deployed.
  report:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check data refresh
        if: needs.build.outputs.refresh == 'failure'
        run: |
          echo "::error::A data source failed to refresh; the last good copy was kept. See the build job's refresh step."
          exit 1
