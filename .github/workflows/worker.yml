name: Deploy sync worker

# Deploys worker/ (settings sync over Workers KV) to Cloudflare. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["worker/**", "tests/worker.mjs", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_TITLE: dynasty-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node tests/worker.mjs

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Find the KV namespace
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          find() {
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const n=(r.result||[]).find(x=>x.title===process.env.KV_TITLE);process.stdout.write(n?n.id:"")})'
          }
          id=$(find)
          if [ -z "$id" ]; then
            echo "No namespace titled $KV_TITLE; creating it."
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"title\":\"$KV_TITLE\"}" "$api" > /dev/null
            id=$(find)
          fi
          [ -n "$id" ] || { echo "::error::Couldn't find or create the $KV_TITLE KV namespace. Check the API token's permissions."; exit 1; }
          sed -i "s/__KV_NAMESPACE_ID__/$id/" worker/wrangler.toml
          echo "Using KV namespace $id"

      - name: Deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy

      - name: Check it's up
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://dynasty-helper-sync.deron-dantzler.workers.dev/health; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::The worker didn't answer at /health."; exit 1
